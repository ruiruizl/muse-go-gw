name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: 拉取协议库
        uses: actions/checkout@v4
        with:
          repository: CoolkHz/muse-protocol-go
          path: sdk

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: 编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o muse-go-gw-linux-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: muse-go-gw-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          body: |
            CI 自动构建 #${{ github.run_number }}
            - linux/amd64
            - linux/arm64
          files: bins/*
          fail_on_unmatched_files: false
